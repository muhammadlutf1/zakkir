name: Feature request
description: Suggest an idea or enhancement
title: "feat: [short description]"
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea  -  focused, well-motivated proposals are easiest to act on.
        Please search existing issues first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who does it help, and in what situation?
      placeholder: |
        Example: As a server admin I want to ... so that ...
        Currently I have to work around it by ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Be specific where you can  -  commands, UI, behavior.
      placeholder: |
        Example: Add a /queue command that shows ...
        Or: Extend /preferences with a ... option that ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one is better.
      placeholder: |
        Example: I considered ..., but it would ...
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the bot would this touch?
      options:
        - Playback / Player / Queue
        - Commands (/play, /radio, /preferences, …)
        - Voice / connection
        - PlayerPanel / components
        - Vote / access control
        - Localization (i18n)
        - Catalog / MP3Quran API
        - Docs / tooling / other
      default: 0
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, examples from other bots, links, or anything else that helps.
      render: markdown
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I am willing to help implement this (optional  -  leave unchecked if you're just proposing the idea).
          required: false
